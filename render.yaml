# Configuração do backend no Render (Blueprint).
# No Render: New > Blueprint > escolha este repositório. Ele lê este arquivo e
# pede só os valores marcados com sync: false (dados do Supabase e do Vercel).
services:
  - type: web
    name: carhealth-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn carhealth.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true          # o Render cria uma chave aleatória
      - key: DJANGO_DEBUG
        value: "False"
      - key: PGSSLMODE
        value: require               # o Supabase exige conexão com SSL
      - key: DB_NAME
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_HOST                 # Supabase > Connect > Session pooler > host
        sync: false
      - key: DB_USER                 # Supabase > Connect > Session pooler > user (postgres.xxxx)
        sync: false
      - key: DB_PASSWORD             # senha criada no Supabase
        sync: false
      - key: CORS_ALLOWED_ORIGINS    # endereço do site no Vercel, ex.: https://carhealth.vercel.app
        sync: false
