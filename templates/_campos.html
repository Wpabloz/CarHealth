{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for campo in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
    {{ campo }}
    {% for erro in campo.errors %}<div class="text-danger small">{{ erro }}</div>{% endfor %}
  </div>
{% endfor %}
<script>
  document.querySelectorAll("form input:not([type=checkbox]), form select, form textarea")
    .forEach(el => el.classList.add(el.tagName === "SELECT" ? "form-select" : "form-control"));
</script>
