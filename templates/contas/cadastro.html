{% extends "base.html" %}
{% block title %}Cadastro · CarHealth{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-1">Cadastrar empresa</h4>
    <p class="text-muted small mb-4">Você será o primeiro usuário (perfil Gestor).</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "_campos.html" %}
      <button class="btn btn-primary w-100">Cadastrar</button>
    </form>
    <p class="text-center mt-3 mb-0 small"><a href="{% url 'contas:login' %}">Já tenho conta</a></p>
  </div></div>
</div></div>
{% endblock %}
