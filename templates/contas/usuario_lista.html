{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Usuários</h3>
  <a class="btn btn-primary" href="{% url 'contas:usuario_novo' %}">+ Novo usuário</a>
</div>
<table class="table table-hover bg-white shadow-sm">
  <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th></th></tr></thead>
  <tbody>
  {% for u in usuarios %}
    <tr><td>{{ u.nome }}</td><td>{{ u.email }}</td><td>{{ u.get_perfil_display }}</td>
      <td class="text-end">{% if u != user %}<a class="btn btn-sm btn-outline-danger" href="{% url 'contas:usuario_excluir' u.pk %}">Excluir</a>{% endif %}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
